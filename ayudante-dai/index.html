## 1. ¿Qué es el Estado en React?

El estado es la información que puede cambiar durante la vida de un componente. Es como la memoria del componente, donde guardamos datos que pueden modificarse y que afectan lo que se muestra en pantalla.

**¿Por qué necesitamos estado?**

- Para que la interfaz reaccione a las acciones del usuario
- Para guardar información temporal (formularios, contadores, etc.)
- Para controlar el comportamiento dinámico de los componentes

**Antes de React (JavaScript tradicional):**

\`\`\`javascript
let contador = 0;
document.getElementById("numero").innerHTML = contador;
\`\`\`

**Con React:**

\`\`\`jsx
const [contador, setContador] = useState(0);
\`\`\`

## 2. Hook useState - Manejo de Estado

El hook \`useState\` nos permite agregar estado a los componentes funcionales.

### Sintaxis Básica

\`\`\`jsx
import { useState } from 'react';

export default function MiComponente() {
  const [estado, setEstado] = useState(valorInicial);

  return (
    // JSX que usa el estado
  );
}
\`\`\`

**Explicación:**

- \`estado\`: Variable que contiene el valor actual
- \`setEstado\`: Función para modificar el estado
- \`valorInicial\`: Valor que tendrá al inicio (0, "", [], {}, etc.)

### Ejemplo con Contador

\`\`\`jsx
"use client"
import { useState } from "react";

export default function Contador() {
  const [cuenta, setCuenta] = useState(0);

  return (
    <div>
      <h2>Contador: {cuenta}</h2>
    </div>
  );
}
\`\`\`

## 3. Hook useEffect - Efectos Secundarios

El hook \`useEffect\` nos permite ejecutar código cuando algo cambia en nuestro componente.

### Sintaxis Básica

\`\`\`jsx
import { useEffect, useState } from 'react';

export default function MiComponente() {
  const [estado, setEstado] = useState(0);

  useEffect(() => {
    // Código que se ejecuta cuando cambia algo
    console.log('El estado cambió:', estado);
  }, [estado]); // Array de dependencias

  return (
    // JSX
  );
}
\`\`\`

**¿Cuándo se ejecuta useEffect?**

- Cuando el componente se monta por primera vez
- Cuando cambian las variables del array de dependencias
- Si no ponemos array de dependencias, se ejecuta en cada render

### Tipos de useEffect

\`\`\`jsx
"use client"
import { useState, useEffect } from 'react';

export default function TiposUseEffect() {
  const [contador, setContador] = useState(0);

  // 1. Se ejecuta solo al montar el componente
  useEffect(() => {
    console.log("Componente montado");
  }, []); // Array vacío

  // 2. Se ejecuta cuando cambia contador
  useEffect(() => {
    console.log("Contador cambió:", contador);
  }, [contador]);

  // 3. Se ejecuta en cada render (¡cuidado!)
  useEffect(() => {
    console.log("En cada render");
  }); // Sin array

  // 4. Cleanup se ejecuta al desmontar
  useEffect(() => {
    const timer = setInterval(() => {
      console.log("Timer ejecutándose");
    }, 1000);

    // Cleanup function
    return () => {
      clearInterval(timer);
      console.log("Timer limpiado");
    };
  }, []);

  return (
    <div>
      <p>Contador: {contador}</p>
      <button onClick={() => setContador(contador + 1)}>
        Incrementar
      </button>
    </div>
  );
}
\`\`\`

## 4. Ejemplo Práctico: Contador

Vamos a crear una página completa con un contador que incremente y decremente.

### Creando la Página Contador

**Archivo:** \`src/app/contador/page.js\`

\`\`\`jsx
"use client"
import { useState, useEffect } from "react";

export default function ContadorPage() {
  // Estado del contador
  const [cuenta, setCuenta] = useState(0);

  // useEffect que se ejecuta cuando cambia la cuenta
  useEffect(() => {
    console.log("La cuenta cambió a:", cuenta);
    document.title = \`Contador: \${cuenta}\`;
  }, [cuenta]);

  // Función para incrementar
  const incrementar = () => {
    setCuenta(cuenta + 1);
  };

  // Función para decrementar
  const decrementar = () => {
    setCuenta(cuenta - 1);
  };

  // Función para resetear
  const resetear = () => {
    setCuenta(0);
  };

  return (
    <div className="contador-container">
      <h1>Página Contador</h1>
      <h2>Cuenta actual: {cuenta}</h2>
      <div className="botones">
        <button onClick={incrementar}>Incrementar (+1)</button>
        <button onClick={decrementar}>Decrementar (-1)</button>
        <button onClick={resetear}>Resetear (0)</button>
      </div>
    </div>
  );
}
\`\`\`

**¿Qué hace este código?**

1. \`useState(0)\`: Inicializa el contador en 0
2. \`useEffect\`: Se ejecuta cada vez que \`cuenta\` cambia
3. **Funciones**: \`incrementar\`, \`decrementar\` y \`resetear\` modifican el estado
4. **Renderizado**: Muestra el valor actual y los botones

## 5. Objeto Event - Capturando Información

El objeto Event es información que nos da HTML cuando ocurre una acción (click, cambio en input, etc.).

### ¿Qué contiene un Event?

\`\`\`javascript
const manejarClick = (event) => {
  console.log(event);        // Objeto completo
  console.log(event.type);   // Tipo de evento: 'click', 'change', etc.
  console.log(event.target); // Elemento que disparó el evento
};
\`\`\`

### Tipos de Eventos Comunes

- \`onClick\`: Cuando se hace clic
- \`onChange\`: Cuando cambia un input
- \`onSubmit\`: Cuando se envía un formulario
- \`onKeyPress\`: Cuando se presiona una tecla

*Documentación: Puedes ver todos los tipos de eventos en W3Schools - Event Object*

### Ejemplo con onChange

\`\`\`jsx
"use client"
import { useState } from 'react';

export default function EjemploEvent() {
  const [texto, setTexto] = useState("");

  const manejarCambio = (event) => {
    console.log("Tipo de evento:", event.type); // 'change'
    console.log("Elemento completo:", event.target); // El input
    console.log("Valor actual:", event.target.value); // Lo que escribió el usuario

    // Actualizar el estado con el nuevo valor
    setTexto(event.target.value);
  };

  return (
    <div>
      <input
        type="text"
        onChange={manejarCambio}
        placeholder="Escribe algo..."
        value={texto}
      />
      <p>Has escrito: {texto}</p>
    </div>
  );
}
\`\`\`

### Propiedades Importantes del Event.target

\`\`\`javascript
const analizarEvent = (event) => {
  console.log("Tipo de input:", event.target.type); // 'text', 'email', etc.
  console.log("Valor actual:", event.target.value); // Lo escrito
  console.log("Placeholder:", event.target.placeholder);
  console.log("Está enfocado:", event.target === document.activeElement);
};
\`\`\`

## 6. Conditional Rendering - Renderizado Condicional

Conditional Rendering es mostrar u ocultar elementos JSX basándose en el valor de variables o estados.

**¿Por qué es importante?**

- Mostrar mensajes de "Cargando..." mientras obtenemos datos
- Ocultar/mostrar formularios, menús o secciones
- Mostrar diferentes contenidos según el estado del usuario
- Manejar errores y mensajes informativos

### Método 1: Operador && (Más común)

\`\`\`jsx
"use client"
import { useState } from 'react';

export default function CondicionalBasico() {
  const [mostrarMensaje, setMostrarMensaje] = useState(false);

  return (
    <div>
      <button onClick={() => setMostrarMensaje(!mostrarMensaje)}>
        {mostrarMensaje ? 'Ocultar' : 'Mostrar'} Mensaje
      </button>

      {/* Solo se muestra si mostrarMensaje es true */}
      {mostrarMensaje && (
        <p>¡Este mensaje se muestra condicionalmente!</p>
      )}
    </div>
  );
}
\`\`\`

**Explicación del \`&&\`:**

- Si \`mostrarMensaje\` es \`true\`, se renderiza el elemento.
- Si \`mostrarMensaje\` es \`false\`, no se renderiza nada.

### Método 2: Operador Ternario ((condicion) ? (true) : (false))

\`\`\`jsx
"use client"
import { useState } from 'react';

export default function CondicionalTernario() {
  const [estaLogueado, setEstaLogueado] = useState(false);

  return (
    <div>
      {estaLogueado ? (
        <div>
          <h2>¡Bienvenido!</h2>
          <p>Estás logueado en el sistema</p>
          <button onClick={() => setEstaLogueado(false)}>
            Cerrar Sesión
          </button>
        </div>
      ) : (
        <div>
          <h2>Iniciar Sesión</h2>

1. Crear la carpeta \`hooks\` en el frontend dentro de \`src/\` y colocar allí el archivo \`useSocket.js\` con el código de la sección 5.1.
2. Descargar el backend proporcionado en el classroom.

## 2. Introducción

WebSocket es un protocolo que abre un único canal de comunicación permanente entre cliente y servidor, en lugar de abrir y cerrar una conexión por cada dato que se necesita (como hace HTTP).

Esto habilita:
- **Bidireccionalidad:** Tanto el cliente como el servidor pueden enviar mensajes en cualquier momento, sin que el otro lo pida.
- **Tiempo real:** Los datos se propagan al instante (chats, notificaciones, juegos, tableros colaborativos, subastas, etc.).
- **Broadcast:** Un mismo evento puede difundirse a muchos clientes conectados a la vez (o solo a los de una *room* como se ve en la sección 3.2).

---

## 3. Configuración del Backend

### 3.1 Configuración inicial del servidor

El backend requiere una configuración específica para poder manejar conexiones WebSocket junto con Express y las sesiones. Utilizamos la librería \`socket.io\`.

\`\`\`javascript
const express = require("express");
const app = express();
const port = process.env.PORT || 4000; // Puerto por el que estoy ejecutando la página Web
const cors = require("cors");
const session = require("express-session"); // Para el manejo de las variables de sesión

app.use(cors());

const server = app.listen(port, () => {
  console.log(\`Servidor NodeJS corriendo en http://localhost:\${port}/\`);
});

const io = require("socket.io")(server, {
  cors: {
    // IMPORTANTE: REVISAR PUERTO DEL FRONTEND
    origin: ["http://localhost:3000", "http://localhost:3001"], // Permitir el origen localhost:3000
    methods: ["GET", "POST", "PUT", "DELETE"], // Métodos permitidos
    credentials: true, // Habilitar el envío de cookies
  },
});

const sessionMiddleware = session({
  secret: "supersarasa", // Elegir tu propia key secreta
  resave: false,
  saveUninitialized: false,
});

app.use(sessionMiddleware);

io.use((socket, next) => {
  sessionMiddleware(socket.request, {}, next);
});
\`\`\`

**Puntos importantes de esta configuración:**
- **Puerto:** El servidor corre en el puerto 4000 por defecto.
- **CORS:** Configurado para permitir conexiones desde los puertos 3000 y 3001 del frontend.
- **Sesiones:** Integración entre Express sessions y Socket.IO para mantener estado de usuario.
- **Middleware:** Permite acceder a las variables de sesión desde los eventos de Socket.IO.

### 3.2 Implementación de eventos Socket.IO

Una vez configurado el servidor, implementamos los eventos que manejarán la comunicación en tiempo real:

\`\`\`javascript
// A PARTIR DE ACÁ LOS EVENTOS DEL SOCKET
io.on("connection", (socket) => {
  const req = socket.request;

  socket.on("joinRoom", (data) => {
    console.log("io.on req.session.room:", req.session.room);
    if (req.session.room != undefined && req.session.room.length > 0) {
      socket.leave(req.session.room);
    }
    req.session.room = data.room;
    socket.join(req.session.room);

    io.to(req.session.room).emit("chat-messages", {
      user: req.session.user,
      room: req.session.room,
    });
  });

  socket.on("pingAll", (data) => {
    console.log("PING ALL: ", data);
    io.emit("pingAll", { event: "Ping to all", message: data });
  });

  socket.on("sendMessage", (data) => {
    io.to(req.session.room).emit("newMessage", {
      room: req.session.room,
      message: data,
    });
  });

  socket.on("disconnect", () => {
    console.log("Disconnect");
  });
});
\`\`\`

**Explicación de cada evento:**
- **\`connection\`:** Se ejecuta automáticamente cuando un cliente se conecta.
- **\`joinRoom\`:** Permite cambiar de sala, saliendo de la anterior y uniéndose a la nueva.
- **\`pingAll\`:** Envía un mensaje a todos los clientes conectados.
- **\`sendMessage\`:** Envía mensajes solo a los clientes de la misma sala.
- **\`disconnect\`:** Se ejecuta cuando un cliente se desconecta.

---

## 4. Explicación del Frontend

En el backend tenemos definidos eventos, que son las acciones con las que el cliente se comunica con el servidor:
- **\`connection\`:** Se establece automáticamente al importar el hook.
- **\`pingAll\`:** Envía un mensaje a todos los clientes conectados.
- **\`joinRoom\`:** Permite unirse a una sala (*room*).
- **\`sendMessage\`:** Envía mensajes a todos los clientes de la sala.
- **\`disconnect\`:** Se dispara automáticamente al finalizar la conexión.

## 5. ¿Cómo usarlo?

### 5.1 Código del hook useSocket

\`\`\`javascript
import { useState, useEffect, useRef } from "react";
import { io } from "socket.io-client";

export default function useSocket({ serverUrl = "ws://localhost:4000", options = {} } = {}) {
  const [isConnected, setIsConnected] = useState(false);
  const socketRef = useRef(null);

  if (!socketRef.current) {
    // Solo se crea una vez
    socketRef.current = io(serverUrl, options);
  }

  useEffect(() => {
    const socket = socketRef.current;

    const onConnect = () => {
      setIsConnected(true);
      console.log("WebSocket conectado:", socket.id);
    };

    const onDisconnect = () => {
      setIsConnected(false);
      console.log("X WebSocket desconectado");
    };

    socket.on("connect", onConnect);
    socket.on("disconnect", onDisconnect);

    return () => {
      socket.off("connect", onConnect);
      socket.off("disconnect", onDisconnect);
    };
  }, []);

  return { socket: socketRef.current, isConnected };
}
\`\`\`

**Ejemplo creando una página nueva en el directorio \`socket\` en el frontend:**

\`\`\`javascript
import useSocket from "@/hooks/useSocket";
import { useEffect } from "react";

export default function SocketPage() {
  const { socket, isConnected } = useSocket();

  useEffect(() => {
    if (!socket) return;
    // Aquí entrará cuando reciba un evento
  }, [socket]);

  return <h1>Socket funcionando</h1>;
}
\`\`\`

Importando el hook y declarando \`socket\` e \`isConnected\`, al conectarnos en la página debería aparecer *"WebSocket conectado"* en la consola.

### 5.2 Evento PingAll

En el frontend definimos un botón que emita el evento:

\`\`\`javascript
function pingAll() {
  socket.emit("pingAll", { msg: "Hola desde mi compu" });
}
\`\`\`

El backend recibe el evento \`pingAll\`, lo emite a todos los clientes conectados y en el frontend debemos escuchar el evento:

\`\`\`javascript
socket.on("pingAll", (data) => {
  console.log(data);
});
\`\`\`

**Ejemplo de mensaje recibido:**
\`\`\`json
{ "event": "pingAll", "message": { "msg": "Hola desde mi compu" } }
\`\`\`

### 5.3 Evento joinRoom

Permite unirse a una sala determinada:

\`\`\`javascript
socket.emit("joinRoom", { room: "pio" });
\`\`\`

**El backend:**
- Sale de la sala anterior.
- Une al cliente a la nueva sala.
- Emite un evento \`chat-messages\` notificando que un usuario ingresó.

### 5.4 Evento sendMessage

Creamos un input y un botón para enviar mensajes:

\`\`\`javascript
const [message, setMessage] = useState("");

function sendMessage() {
  socket.emit("sendMessage", { message });
}
\`\`\`

El backend recibe \`sendMessage\` y emite:

\`\`\`json
{
  "room": "pio",
  "message": { "message": "Mensaje a la sala" }
}
\`\`\`

El frontend escucha con:

\`\`\`javascript
socket.on("newMessage", (data) => {
  console.log(data);
});
\`\`\`

### 5.5 Evento personalizado

Podemos crear eventos propios. Ejemplo:

**Backend:**
\`\`\`javascript
let contador = 0;

socket.on("eventoPersonalizado", () => {
  contador++;
  socket.emit("respuestaPersonalizada", { contador });
});
\`\`\`

**Frontend:**
\`\`\`javascript
function emitirEvento() {
  socket.emit("eventoPersonalizado");
}

useEffect(() => {
  socket.on("respuestaPersonalizada", (data) => {
    setContador(data.contador);
  });
}, [socket]);
\`\`\`

El backend está configurado para aceptar conexiones desde 3000 y 3001.

### 6.1 Prueba con múltiples puertos

**Abrir dos clientes:**
- Uno en \`http://localhost:3000\`
- Otro en \`http://localhost:3001\`

**Probar:**

- \`sendMessage\`: solo los clientes que estén en la misma sala (\`pio\`) recibirán el mensaje.

Con esto finaliza la explicación y uso de \`useSocket\` en React.

## 1. Introducción a Fetch

Fetch es la herramienta que utilizamos para realizar comunicación entre frontend y backend. Nos permite enviar y recibir datos desde nuestro servidor.

### ¿Qué es Fetch?

Fetch es una API nativa de JavaScript que nos permite realizar peticiones HTTP de manera asíncrona:

\`\`\`javascript
// Sintaxis básica
fetch('http://localhost:3001/api/datos')
  .then(response => response.json())
  .then(data => console.log(data));
\`\`\`

### Arquitectura Frontend-Backend

En nuestros proyectos tendremos dos módulos separados:

\`\`\`text
Proyecto/
├── backend/            # Servidor Express (Puerto 3001)
│   ├── app.js
│   └── routes/
└── frontend/           # Aplicación NextJS (Puerto 3000)
    └── src/app/
        └── components/
\`\`\`

> **Nota Importante:** Usamos puerto 3001 para el backend para evitar conflictos con NextJS que usa el puerto 3000.

---

## 2. Configuración del Backend

### Servidor Express Básico

\`\`\`javascript
// backend/app.js
const express = require('express');
const cors = require('cors');
const app = express();

// Middleware
app.use(cors());
app.use(express.json());

// Endpoint de ejemplo
app.get('/saludo', (req, res) => {
  res.json({
    mensaje: 'Hola desde el backend!',
    timestamp: new Date().toISOString()
  });
});

// Endpoint con datos de ejemplo
app.get('/estudiantes', (req, res) => {
  const estudiantes = [
    { id: 1, nombre: 'Juan', edad: 17, especialidad: 'Informática' },
    { id: 2, nombre: 'María', edad: 16, especialidad: 'Química' },
    { id: 3, nombre: 'Carlos', edad: 17, especialidad: 'Informática' },
    { id: 4, nombre: 'Ana', edad: 16, especialidad: 'Electrónica' }
  ];
  res.json(estudiantes);
});

// Iniciar servidor en puerto 3001
app.listen(3001, () => {
  console.log('Backend ejecutándose en http://localhost:3001');
});
\`\`\`

## 3. Implementación de Fetch en NextJS

### Hook useEffect para Fetch y uso de useState

Seguimos la documentación oficial de NextJS: Client-side Data Fetching.

\`\`\`javascript
// src/app/ejemplo/page.js
"use client"
import { useState, useEffect } from 'react';

export default function EjemploFetch() {
  const [mensaje, setMensaje] = useState('');
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // Fetch al cargar el componente
    fetch('http://localhost:3001/saludo')
      .then(response => response.json())
      .then(data => {
        console.log(data); // Se muestra en consola del navegador
        setMensaje(data.mensaje);
        setLoading(false);
      });
  }, []); // Array vacío: solo se ejecuta una vez

  if (loading) {
    return <div>Cargando...</div>;
  }

  return (
    <div>
      <h1>Respuesta del Backend</h1>
      <p>{mensaje}</p>
    </div>
  );
}
\`\`\`

### ¿Por qué usar .then() en lugar de async/await?

\`useEffect\` NO puede ser directamente \`async\`, por eso usamos \`.then()\`:

\`\`\`javascript
// ❌ Incorrecto: useEffect no puede ser async
useEffect(async () => {
  const response = await fetch('http://localhost:3001/saludo');
  // Esto causará errores
}, []);

// ✔️ Correcto: Usar .then()
useEffect(() => {
  fetch('http://localhost:3001/saludo')
    .then(response => response.json())
    .then(data => console.log(data));
}, []);

// ✔️ Alternativa: Función async dentro de useEffect
useEffect(() => {
  const fetchData = async () => {
    const response = await fetch('http://localhost:3001/saludo');
    const data = await response.json();
    console.log(data);
  };
  fetchData();
}, []);
\`\`\`

## 4. Métodos HTTP con Fetch

### GET - Obtener Datos

\`\`\`javascript
// GET es el método por defecto
fetch('http://localhost:3001/estudiantes')
  .then(response => response.json())
  .then(data => console.log(data));
\`\`\`

### POST - Enviar Datos

\`\`\`javascript
const crearEstudiante = () => {
  const nuevoEstudiante = {
    nombre: 'Pedro',
    edad: 17,
    especialidad: 'Informática'
  };

  fetch('http://localhost:3001/estudiantes', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(nuevoEstudiante)
  })
    .then(response => response.json())
    .then(data => {
      console.log('Estudiante creado:', data);
      // Actualizar la lista local
      setEstudiantes([...estudiantes, data]);
    });
};
\`\`\`

### PUT - Actualizar Datos

\`\`\`javascript
const actualizarEstudiante = (id, datosActualizados) => {
  fetch(\`http://localhost:3001/estudiantes/\${id}\`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(datosActualizados)
  })
    .then(response => response.json())
    .then(data => console.log('Estudiante actualizado:', data));
};
\`\`\`

### DELETE - Eliminar Datos

\`\`\`javascript
const eliminarEstudiante = (id) => {
  fetch(\`http://localhost:3001/estudiantes/\${id}\`, {
    method: 'DELETE'
  })
    .then(response => {
      if (response.ok) {
        // Remover de la lista local
        setEstudiantes(estudiantes.filter(e => e.id !== id));
      }
    });
};
\`\`\`

## 5. Métodos de Array Fundamentales

Los métodos de array son fundamentales cuando trabajamos con datos del backend. Los más utilizados son:

### 5.1. map() - Transformar Elementos

\`map()\` transforma cada elemento de un array y devuelve un nuevo array:

\`\`\`javascript
const numeros = [1, 2, 3, 4, 5];

// Multiplicar cada número por 2
const numerosDobles = numeros.map(numero => numero * 2);
// Resultado: [2, 4, 6, 8, 10]

// En React: Renderizar lista de estudiantes
const estudiantesJSX = estudiantes.map(estudiante => (
  <div key={estudiante.id}>
    <h3>{estudiante.nombre}</h3>
    <p>Edad: {estudiante.edad}</p>
  </div>
));
\`\`\`

**Ejemplo práctico con objetos:**

\`\`\`javascript
const estudiantes = [
  { id: 1, nombre: 'Juan', edad: 17 },
  { id: 2, nombre: 'María', edad: 16 },
  { id: 3, nombre: 'Carlos', edad: 17 }
];

// Extraer solo los nombres
const nombres = estudiantes.map(est => est.nombre);
// Resultado: ['Juan', 'María', 'Carlos']

// Crear objetos con información adicional
const estudiantesConInfo = estudiantes.map(est => ({
  ...est,
  esAdulto: est.edad >= 18,
  iniciales: est.nombre.charAt(0)
}));
\`\`\`

### 5.2. filter() - Filtrar Elementos

\`filter()\` devuelve un nuevo array solo con elementos que cumplan una condición:

\`\`\`javascript
const estudiantes = [
  { id: 1, nombre: 'Juan', edad: 17, especialidad: 'Informática' },
  { id: 2, nombre: 'María', edad: 16, especialidad: 'Química' },
  { id: 3, nombre: 'Carlos', edad: 18, especialidad: 'Informática' }
];

// Filtrar estudiantes de Informática
const informaticos = estudiantes.filter(est => est.especialidad === 'Informática');

// Filtrar estudiantes mayores de edad
const mayores = estudiantes.filter(est => est.edad >= 18);

// Filtrar por múltiples condiciones
const informaticosAdultos = estudiantes.filter(est =>
  est.especialidad === 'Informática' && est.edad >= 18
);
\`\`\`

### 5.3. find() - Encontrar un Elemento

\`find()\` devuelve el primer elemento que cumple la condición:

\`\`\`javascript
const estudiantes = [
  { id: 1, nombre: 'Juan', edad: 17 },
  { id: 2, nombre: 'María', edad: 16 },
  { id: 3, nombre: 'Carlos', edad: 17 }
];

// Buscar por ID
const estudiante = estudiantes.find(est => est.id === 2);
// Resultado: { id: 2, nombre: 'María', edad: 16 }

// Buscar por nombre
const juan = estudiantes.find(est => est.nombre === 'Juan');

// Si no encuentra nada, devuelve undefined
const inexistente = estudiantes.find(est => est.id === 999);
// Resultado: undefined
\`\`\`

### 5.4. forEach() - Ejecutar Función para Cada Elemento

\`forEach()\` ejecuta una función para cada elemento pero no devuelve nada:

\`\`\`javascript
const estudiantes = ['Juan', 'María', 'Carlos'];

// Mostrar cada nombre en consola
estudiantes.forEach(nombre => {
  console.log(\`Estudiante: \${nombre}\`);
});

// Con índice
estudiantes.forEach((nombre, indice) => {

\`\`\`

### 5.5. some() - Verificar si Algún Elemento Cumple

\`some()\` devuelve \`true\` si al menos un elemento cumple la condición:

\`\`\`javascript
const edades = [15, 16, 17, 18, 19];

// ¿Hay algún mayor de edad?
const hayMayores = edades.some(edad => edad >= 18);
// Resultado: true

// ¿Hay algún menor de 15?
const hayMenores = edades.some(edad => edad < 15);
// Resultado: false
\`\`\`

### 5.6. every() - Verificar si Todos los Elementos Cumplen

\`every()\` devuelve \`true\` si todos los elementos cumplen la condición:

\`\`\`javascript
const edades = [18, 19, 20, 21];

// ¿Todos son mayores de edad?
const todosMayores = edades.every(edad => edad >= 18);
// Resultado: true

// ¿Todos son menores de 25?
const todosMenores = edades.every(edad => edad < 25);
// Resultado: true
\`\`\`

> **Nota:** Existen gran cantidad de métodos array útiles según la necesidad y pueden consultarse en la web de MDN.

                    <button type="button" class="btn-primary" onclick="generateWebSocketCode()">Generar Código</button>

                </div>`;
                contentElement.innerHTML = html;
                addWebSocketEvent();
            }
        }

        // ==== 6. LÓGICA ESPECÍFICA DE GENERADORES ====

        // --- HELPERS GENERALES ---
        function toPascalCase(str) {
            return str.replace(/(?:^|[\s- '_])+(.)?/g, (_, chr) => chr ? chr.toUpperCase() : '');
        }

        function crearBloqueDeCodigo(codigo, lenguaje = 'javascript') {
            return `
                <div class="code-block-container">
                    <div class="code-header">
                        <span>Código Generado</span>
                        <button class="copy-btn" onclick="copiarCodigo(this)">Copiar</button>
                    </div>
                    <pre class="code-block"><code>${codigo.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                </div>
            `;
        }

        window.copiarCodigo = function(btn) {
            const code = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "¡Copiado!";
                btn.style.background = "var(--neon-green)";
                btn.style.color = "#000";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "";
                    btn.style.color = "";
                }, 1500);
            });
        };

        // --- LÓGICA HOOKS (COMPLEJA) ---
        function initHooksGenerator() {
            renderHooksMode('simple-useState');
            
            document.querySelectorAll('.hook-option').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.hook-option').forEach(e => e.classList.remove('active'));
                    this.classList.add('active');
                    renderHooksMode(this.dataset.hookMode);
                });
            });

            document.getElementById('btn-generate-hooks').addEventListener('click', generateHooksCode);
        }

        function renderHooksMode(mode) {
            const container = document.getElementById('hooks-dynamic-area');
            container.innerHTML = '';

            if (mode === 'simple-useState') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Variable</label><input class="form-input" id="h-var" placeholder="contador"></div>
                    <div class="form-group"><label class="form-label">Valor Inicial</label><input class="form-input" id="h-val" placeholder="0"></div>
                `;
            } else if (mode === 'simple-useEffect') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Dependencias (coma sep.)</label><input class="form-input" id="h-deps" placeholder="dato, otro"></div>
                    <div class="checkbox-group"><input type="checkbox" id="h-cleanup"><label for="h-cleanup">¿Necesita cleanup?</label></div>
                    <div class="form-group" style="margin-top:0.5rem;"><label class="form-label">Descripción (comentario)</label><input class="form-input" id="h-desc" placeholder="Suscribirse a..."></div>
                `;
            } else if (mode === 'combined') {
                container.innerHTML = `
                    <div style="margin-bottom:1rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
                        <label class="form-label">Lista de useState</label>
                        <div id="combined-usestate-list"></div>
                        <button type="button" class="btn-add" onclick="addCombinedUseState()">+ Agregar useState</button>
                    </div>
                    <div>
                        <label class="form-label">Lista de useEffect</label>
                        <div id="combined-useeffect-list"></div>
                        <button type="button" class="btn-add" onclick="addCombinedUseEffect()">+ Agregar useEffect</button>
                    </div>
                `;
                addCombinedUseState();
                addCombinedUseEffect();
            }
        }

        window.addCombinedUseState = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.style.flexWrap = 'wrap';
            div.innerHTML = `
                <input class="form-input" style="flex:1; min-width:100px;" placeholder="Variable (ej: count)" data-type="us-var">
                <input class="form-input" style="flex:1; min-width:100px;" placeholder="Inicial (ej: 0)" data-type="us-val">
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('combined-usestate-list').appendChild(div);
        };

        window.addCombinedUseEffect = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.style.flexWrap = 'wrap';
            div.innerHTML = `
                <input class="form-input" style="flex:2; min-width:150px;" placeholder="Dependencias (ej: user, id)" data-type="ue-deps">
                <div style="display:flex; align-items:center; gap:5px; color:var(--text-secondary); font-size:0.8rem;">
                    <input type="checkbox" data-type="ue-clean"> Cleanup
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('combined-useeffect-list').appendChild(div);
        };

        function generateHooksCode() {
            const modeEl = document.querySelector('.hook-option.active');
            const mode = modeEl ? modeEl.dataset.hookMode : 'simple-useState';
            const wrap = document.getElementById('wrap-component').checked;
            
            let imports = new Set();
            let body = '';
            let hasClient = false;

            if (mode === 'simple-useState') {
                const v = document.getElementById('h-var').value || 'estado';
                const val = document.getElementById('h-val').value || 'null';
                const setter = 'set' + v.charAt(0).toUpperCase() + v.slice(1);
                imports.add('useState');
                body = `const [${v}, ${setter}] = useState(${val});`;
                hasClient = true;
            } 
            else if (mode === 'simple-useEffect') {
                const deps = document.getElementById('h-deps').value;
                const clean = document.getElementById('h-cleanup').checked;
                const desc = document.getElementById('h-desc').value || 'Efecto secundario';
                imports.add('useEffect');
                
                body = `useEffect(() => {\n    // ${desc}\n`;
                if (clean) {
                    body += `    \n    return () => {\n      // Limpieza\n    };\n`;
                }
                body += `  }, [${deps}]);`;
                hasClient = true;
            } 
            else if (mode === 'combined') {
                // Recorrer UseStates
                const usRows = document.querySelectorAll('#combined-usestate-list .dynamic-list-row');
                if (usRows.length > 0) {
                    imports.add('useState');
                    usRows.forEach(row => {
                        const v = row.querySelector('[data-type="us-var"]').value || 'estado';
                        const val = row.querySelector('[data-type="us-val"]').value || 'null';
                        const setter = 'set' + v.charAt(0).toUpperCase() + v.slice(1);
                        body += `const [${v}, ${setter}] = useState(${val});\n  `;
                    });
                    hasClient = true;
                }

                // Recorrer UseEffects
                const ueRows = document.querySelectorAll('#combined-useeffect-list .dynamic-list-row');
                if (ueRows.length > 0) {
                    imports.add('useEffect');
                    ueRows.forEach(row => {
                        const deps = row.querySelector('[data-type="ue-deps"]').value;
                        const clean = row.querySelector('[data-type="ue-clean"]').checked;
                        
                        body += `useEffect(() => {\n    // Efecto\n`;
                        if (clean) {
                            body += `    return () => {\n      // Limpieza\n    };\n`;
                        }
                        body += `  }, [${deps}]);\n  `;
                    });
                    hasClient = true;
                }
            }

            let finalCode = '';
            if (hasClient) finalCode += "'use client';\n";
            if (imports.size > 0) {
                finalCode += `import { ${Array.from(imports).join(', ')} } from 'react';\n\n`;
            }

            if (wrap) {
                finalCode += `export default function MiComponente() {\n  ${body}\n\n  return (\n    <div>\n      {/* Contenido */}\n    </div>\n  );\n}`;
            } else {
                finalCode = body.trim();
            }

            document.getElementById('generated-code').innerHTML = crearBloqueDeCodigo(finalCode);
        }

        // --- LÓGICA COMPONENTES BÁSICOS ---
        window.addPropRow = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.innerHTML = `
                <input class="form-input" style="flex:2" placeholder="Nombre prop (ej: onClick)" data-prop-name>
                <div style="display:flex; align-items:center; gap:5px; color:var(--text-secondary); font-size:0.8rem; white-space:nowrap;">
                    <input type="checkbox" data-prop-req> Obligatoria
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('props-list').appendChild(div);
        };

        window.generateBasicComponent = function() {
            const name = toPascalCase(document.getElementById('comp-name').value) || 'MiComponente';
            const destino = document.getElementById('comp-destino').value;
            const useClient = document.getElementById('use-client').checked;
            const useChildren = document.getElementById('use-children').checked;
            const wrap = document.getElementById('wrap-component').checked;

            // Detectar props de función para activar useClient automáticamente si no está marcado
            let propsList = [];
            let hasFuncProp = false;
            document.querySelectorAll('#props-list .dynamic-list-row').forEach(row => {
                const pName = row.querySelector('[data-prop-name]').value;
                if (pName) {
                    propsList.push(pName);
                    if (pName.toLowerCase().includes('on')) hasFuncProp = true;
                }
            });
            if (hasFuncProp && !useClient) document.getElementById('use-client').checked = true; // Feedback visual solo

            let code = '';
            if (useClient || hasFuncProp) code += "'use client';\n";
            
            // Comentario de ruta
            const ruta = destino === 'page' ? `// src/app/${name.toLowerCase()}/page.js` : `// src/components/${name}.jsx`;
            code += `${ruta}\n`;

            let propsStr = propsList.join(', ');
            if (useChildren) propsStr = propsStr ? `${propsStr}, children` : 'children';

            const funcSig = `export default function ${name}({ ${propsStr} }) {`;
            
            let body = `  return (\n    <div>\n      ${useChildren ? '{children}' : '<!-- Contenido -->'}\n    </div>\n  );\n}`;

            if (wrap) {
                code += `\n${funcSig}\n${body}\n}`;
            } else {
                code += `\n${funcSig}\n  // ... resto de tu lógica\n${body}\n}`;
            }

            document.getElementById('generated-code').innerHTML = crearBloqueDeCodigo(code);
        };

        // --- LÓGICA COMPONENTES COMPUESTOS ---
        window.addSubCompRow = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.innerHTML = `
                <input class="form-input" style="flex:1" placeholder="Nombre (ej: Button)" data-sc-name>
                <input class="form-input" style="flex:1" placeholder="Ruta (ej: ./Button)" data-sc-path>
                <input class="form-input" style="flex:1" placeholder="Prop padre (ej: onClick)" data-sc-prop>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('subcomp-list').appendChild(div);
        };

        window.generateCompoundComponent = function() {
            const name = toPascalCase(document.getElementById('comp-comp-name').value) || 'Compuesto';
            const wrap = document.getElementById('wrap-component').checked;
            
            let imports = [];
            let jsxChildren = [];
            
            document.querySelectorAll('#subcomp-list .dynamic-list-row').forEach(row => {
                const compName = row.querySelector('[data-sc-name]').value;
                const path = row.querySelector('[data-sc-path]').value || '.';
                const prop = row.querySelector('[data-sc-prop]').value;
                
                if (compName) {
                    imports.push(`import ${compName} from '${path}';`);
                    const propAttr = prop ? ` ${prop}={${prop}}` : '';
                    jsxChildren.push(`      <${compName}${propAttr} />`);
                }
            });

            let code = "'use client';\n\n";
            code += imports.join('\n') + '\n\n';

            const body = `  return (\n    <div>\n${jsxChildren.join('\n')}\n    </div>\n  );`;
            const funcSig = `export default function ${name}({ ${document.querySelectorAll('#subcomp-list .dynamic-list-row').map(r => r.querySelector('[data-sc-prop]').value).filter(Boolean).join(', ')} }) {`;

            if (wrap) {
                code += `${funcSig}\n${body}\n}`;
            } else {
                code += `${funcSig}\n  // ... lógica intermedia\n${body}\n}`;
            }

            document.getElementById('generated-code').innerHTML = crearBloqueDeCodigo(code);
        };

        // --- LÓGICA ESTILOS CLSX ---
        window.addFixedClassRow = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.innerHTML = `
                <input class="form-input" placeholder="Clase fija (ej: button)" data-fc-name>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('fixed-classes-list').appendChild(div);
        };

        window.addConditionalClassRow = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.innerHTML = `
                <input class="form-input" style="flex:1" placeholder="Clase (ej: activo)" data-cc-name>
                <input class="form-input" style="flex:1" placeholder="Condición (ej: isActive)" data-cc-cond>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('conditional-classes-list').appendChild(div);
        };

        window.generateClsxStyles = function() {
            const name = toPascalCase(document.getElementById('style-comp-name').value) || 'Estilizado';
            const wrap = document.getElementById('wrap-component').checked;
            
            let fixedClasses = [];
            document.querySelectorAll('#fixed-classes-list .dynamic-list-row').forEach(row => {
                const val = row.querySelector('[data-fc-name]').value;
                if (val) fixedClasses.push(`styles.${val}`);
            });

            let conditionalObj = [];
            document.querySelectorAll('#conditional-classes-list .dynamic-list-row').forEach(row => {
                const cls = row.querySelector('[data-cc-name]').value;
                const cond = row.querySelector('[data-cc-cond]').value;
                if (cls && cond) {
                    conditionalObj.push(`[styles.${cls}]: ${cond}`);
                }
            });

            let code = `import styles from './${name}.module.css';\nimport clsx from 'clsx';\n\n`;
            
            const classNameLogic = `clsx(\n      ${fixedClasses.join(',\n      ')}${fixedClasses.length ? ',\n' : ''}
      {
        ${conditionalObj.join(',\n        ')}
      }
    )`;

            const body = `  return (\n    <div className={${classNameLogic}}>\n      Contenido\n    </div>\n  );`;
            const funcSig = `export default function ${name}({ ${conditionalObj.map(o => o.split(':')[1].trim()).join(', ')} }) {`;

            if (wrap) {
                code += `\n${funcSig}\n${body}\n}`;
            } else {
                code += `\n${funcSig}\n  // ...\n${body}\n}`;
            }

            document.getElementById('generated-code').innerHTML = crearBloqueDeCodigo(code);
        };

        // --- LÓGICA WEBSOCKETS ---
        window.addWebSocketEvent = function() {
            const div = document.createElement('div');
            div.className = 'dynamic-list-row';
            div.innerHTML = `
                <input class="form-input" style="flex:1" placeholder="Evento (ej: connection)" data-ws-event>
                <input class="form-input" style="flex:1" placeholder="Callback (ej: onConnection)" data-ws-callback>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('ws-events-list').appendChild(div);
        };

        window.generateWebSocketCode = function() {
            const includeServer = document.getElementById('ws-include-server').checked;
            const hookName = document.getElementById('ws-hook-name').value || 'useSocket';
            const serverUrl = document.getElementById('ws-server-url').value || 'http://localhost:3001';
            const includeJoinRoom = document.getElementById('ws-include-joinroom').checked;
            const includeSendMessage = document.getElementById('ws-include-sendmessage').checked;
            const includePingAll = document.getElementById('ws-include-pingall').checked;

            let events = [];
            document.querySelectorAll('#ws-events-list .dynamic-list-row').forEach(row => {
                const eventName = row.querySelector('[data-ws-event]').value;
                const callback = row.querySelector('[data-ws-callback]').value;
                if (eventName && callback) {
                    events.push({ event: eventName, callback: callback });
                }
            });

            let code = '';

            // Código del servidor (opcional)
            if (includeServer) {
                code += `// === SERVIDOR (server.js) ===\n`;
                code += `const express = require('express');\n`;
                code += `const http = require('http');\n`;
                code += `const { Server } = require('socket.io');\n\n`;
                code += `const app = express();\n`;
                code += `const server = http.createServer(app);\n`;
                code += `const io = new Server(server, {\n`;
                code += `  cors: {\n`;
                code += `    origin: "http://localhost:3000",\n`;
                code += `    methods: ["GET", "POST"]\n`;
                code += `  }\n`;
                code += `});\n\n`;
                code += `io.on('connection', (socket) => {\n`;
                code += `  console.log('Usuario conectado:', socket.id);\n\n`;
                code += `  socket.on('joinRoom', (roomId) => {\n`;
                code += `    socket.join(roomId);\n`;
                code += `    console.log(\`Usuario \${socket.id} se unió a la sala \${roomId}\`);\n`;
                code += `  });\n\n`;
                code += `  socket.on('sendMessage', ({ roomId, message }) => {\n`;
                code += `    io.to(roomId).emit('receiveMessage', { userId: socket.id, message });\n`;
                code += `  });\n\n`;
                code += `  socket.on('disconnect', () => {\n`;
                code += `    console.log('Usuario desconectado:', socket.id);\n`;
                code += `  });\n`;
                code += `});\n\n`;
                code += `server.listen(3001, () => {\n`;
                code += `  console.log('Servidor Socket.IO escuchando en puerto 3001');\n`;
                code += `});\n\n\n`;
            }

            // Código del hook useSocket
            code += `// === HOOK useSocket ===\n`;
            code += `'use client';\n\n`;
            code += `import { useEffect, useRef } from 'react';\n`;
            code += `import { io } from 'socket.io-client';\n\n`;
            code += `export default function ${hookName}(serverUrl = '${serverUrl}') {\n`;
            code += `  const socketRef = useRef(null);\n\n`;
            code += `  useEffect(() => {\n`;
            code += `    // Crear conexión\n`;
            code += `    socketRef.current = io(serverUrl, {\n`;
            code += `      transports: ['websocket'],\n`;
            code += `      reconnection: true,\n`;
            code += `      reconnectionDelay: 1000\n`;
            code += `    });\n\n`;
            code += `    // Escuchar eventos\n`;
            events.forEach(e => {
                code += `    socketRef.current.on('${e.event}', ${e.callback});\n`;
            });
            if (events.length === 0) {
                code += `    socketRef.current.on('connect', () => {\n`;
                code += `      console.log('Conectado al servidor WebSocket');\n`;
                code += `    });\n`;
            }
            code += `\n`;
            code += `    // Cleanup\n`;
            code += `    return () => {\n`;
            events.forEach(e => {
                code += `      socketRef.current.off('${e.event}', ${e.callback});\n`;
            });
            code += `      socketRef.current.disconnect();\n`;
            code += `    };\n`;
            code += `  }, [serverUrl]);\n\n`;
            code += `  // Funciones útiles\n`;
            
            if (includeJoinRoom) {
                code += `  const joinRoom = (roomId) => {\n`;
                code += `    if (socketRef.current) {\n`;
                code += `      socketRef.current.emit('joinRoom', roomId);\n`;
                code += `    }\n`;
                code += `  };\n\n`;
            }
            
            if (includeSendMessage) {
                code += `  const sendMessage = (roomId, message) => {\n`;
                code += `    if (socketRef.current) {\n`;
                code += `      socketRef.current.emit('sendMessage', { roomId, message });\n`;
                code += `    }\n`;
                code += `  };\n\n`;
            }
            
            if (includePingAll) {
                code += `  const pingAll = () => {\n`;
                code += `    if (socketRef.current) {\n`;
                code += `      socketRef.current.emit('pingAll');\n`;
                code += `    }\n`;
                code += `  };\n\n`;
            }
            
            code += `  return {\n`;
            code += `    socket: socketRef.current,\n`;
            if (includeJoinRoom) code += `    joinRoom,\n`;
            if (includeSendMessage) code += `    sendMessage,\n`;
            if (includePingAll) code += `    pingAll,\n`;
            code += `  };\n`;
            code += `}\n`;

            document.getElementById('generated-code').innerHTML = crearBloqueDeCodigo(code);
        };
        // ==== 7. INIT ====
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderTeoria(TOPICS[0]);
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    modoActivo = this.dataset.mode;
                    const topicData = TOPICS.find(t => t.id === temaActivo);
                    if (modoActivo === "teoria") {
                        renderTeoria(topicData);
                    } else {
                        renderGenerador(topicData);
                    }
                });
            });
        });
    </script>
</body>
</html>
