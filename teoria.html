<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 DAI — Teoría (offline)</title>
<style>
/* ============ NEÓN CLÁSICO — variables y base ============ */
:root{
  --bg:#07030f; --bg2:#0d0620;
  --neon-cyan:#00f0ff;   /* FRONT */
  --neon-magenta:#ff2bd6;/* BACK */
  --neon-green:#39ff14;
  --neon-violet:#b026ff;
  --neon-yellow:#fff200;
  --txt:#e8e6f0; --dim:#a9a3c2;
  --panel:#0b0518; --code-bg:#050308;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI', system-ui, sans-serif;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,43,214,.05) 1px, transparent 1px),
    radial-gradient(ellipse at 50% -10%, #1a0b35 0%, var(--bg2) 45%, var(--bg) 100%);
  background-size:34px 34px, 34px 34px, 100% 100%;}
.wrap{max-width:1400px;margin:0 auto;padding:0 14px 60px}

/* título cartel de neón */
.app-title{font-size:clamp(20px,3.2vw,30px);letter-spacing:.12em;color:var(--neon-cyan);
  text-shadow:0 0 6px var(--neon-cyan),0 0 16px rgba(0,240,255,.55);margin:14px 0 4px;font-weight:800;}
.app-sub{color:var(--dim);font-size:12.5px;margin:0 0 10px}
@media (prefers-reduced-motion: no-preference){
  .flicker{animation:flick 5s infinite steps(1,end)}
  @keyframes flick{0%,92%,96%,100%{opacity:1}93%{opacity:.55}94%{opacity:.85}97%{opacity:.7}}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* barra superior */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--neon-violet);
  border-radius:10px;padding:10px 12px;background:rgba(11,5,24,.7);box-shadow:0 0 6px rgba(176,38,255,.4), inset 0 0 14px rgba(176,38,255,.08)}
.main-tabs{display:flex;gap:8px}
.mtab{background:transparent;border:1px solid var(--dim);color:var(--txt);padding:9px 18px;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.05em}
.mtab.active{border-color:var(--neon-cyan);color:var(--neon-cyan);
  box-shadow:0 0 6px var(--neon-cyan), inset 0 0 10px rgba(0,240,255,.15);text-shadow:0 0 6px rgba(0,240,255,.7)}
.searchbox{flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.searchbox input{width:100%;background:var(--panel);border:1px solid var(--dim);color:var(--txt);
  padding:9px 12px;border-radius:8px;font-size:14px}
.searchbox input:focus-visible{outline:none;border-color:var(--neon-yellow);box-shadow:0 0 6px var(--neon-yellow)}
.optgroup{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--dim)}
.optgroup label{display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
input[type=checkbox]{accent-color:var(--neon-green);width:15px;height:15px;cursor:pointer}
.legend{display:flex;gap:10px;align-items:center;font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.06em}
.badge.back{color:var(--neon-magenta);border:1px solid var(--neon-magenta);box-shadow:0 0 6px rgba(255,43,214,.5)}
.badge.front{color:var(--neon-cyan);border:1px solid var(--neon-cyan);box-shadow:0 0 6px rgba(0,240,255,.5)}

/* layout con sidebar */
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px}
.sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:10px;align-self:start;max-height:calc(100vh - 20px);overflow:auto}
.side-label{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:6px 2px 2px}
.sbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;line-height:1.3}
.sbtn:hover{border-color:var(--neon-violet);box-shadow:0 0 6px rgba(176,38,255,.5)}
.sbtn.active{border-color:var(--neon-cyan);color:var(--neon-cyan);box-shadow:0 0 6px rgba(0,240,255,.45);background:rgba(0,240,255,.05)}
select.mobilenav{display:none;width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--neon-violet);border-radius:8px;padding:10px;font-size:14px}

/* tarjetas de contenido */
.card{border:1px solid var(--neon-violet);border-radius:12px;padding:16px 18px;margin-bottom:16px;
  background:rgba(11,5,24,.72);box-shadow:0 0 6px rgba(176,38,255,.28), inset 0 0 22px rgba(176,38,255,.05)}
.card h2{margin:0 0 8px;color:var(--neon-cyan);font-size:21px;text-shadow:0 0 6px rgba(0,240,255,.6)}
.card h3{color:var(--neon-yellow);font-size:16px;margin:16px 0 6px;text-shadow:0 0 5px rgba(255,242,0,.35)}
.card p,.card li{line-height:1.55;font-size:14.5px;color:var(--txt)}
.card ul{margin:6px 0;padding-left:22px}
.hint{color:var(--dim);font-size:12.5px}
mark{background:var(--neon-yellow);color:#000;padding:0 2px;border-radius:3px}
.warn-list li{margin-bottom:7px}
table.neon-table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13.5px}
.neon-table th{color:var(--neon-cyan);border-bottom:1px solid var(--neon-cyan);padding:6px 8px;text-align:left;white-space:nowrap}
.neon-table td{border-bottom:1px solid rgba(169,163,194,.22);padding:6px 8px;vertical-align:top}
pre.inline-code, code{font-family:Consolas,'Courier New',monospace}
.card :not(pre) > code{background:#160a2b;border:1px solid rgba(176,38,255,.4);border-radius:5px;padding:1px 5px;font-size:12.8px;color:#aef7ff}

/* bloques de código */
.codeblock{border:1px solid var(--neon-cyan);border-radius:10px;margin:10px 0;overflow:hidden;box-shadow:0 0 6px rgba(0,240,255,.25)}
.codeblock.back-border{border-color:var(--neon-magenta);box-shadow:0 0 6px rgba(255,43,214,.28)}
.code-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:#120826;border-bottom:1px solid rgba(0,240,255,.25)}
.code-title{font-weight:700;font-size:13px;color:var(--txt)}
.code-file{font-family:Consolas,'Courier New',monospace;font-size:12px;color:var(--neon-yellow)}
.btn-copy{margin-left:auto;background:transparent;color:var(--neon-green);border:1px solid var(--neon-green);
  border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-copy:hover,.btn-copy:focus-visible{box-shadow:0 0 8px var(--neon-green);outline:none}
pre.code{margin:0;padding:12px 14px;background:var(--code-bg);color:#e8f6fa;
  font-family:Consolas,'Courier New',monospace;font-size:12.6px;line-height:1.5;
  overflow:auto;white-space:pre;tab-size:2;max-height:520px}

/* generador: acordeón + split */
.gen-desc{color:var(--dim);font-size:13.5px;margin:2px 0 10px}
.gitem{border:1px solid var(--dim);border-radius:10px;margin-bottom:10px;overflow:hidden;background:rgba(11,5,24,.6)}
.gitem.open{border-color:var(--neon-cyan);box-shadow:0 0 8px rgba(0,240,255,.35)}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;gap:10px}
.gtitle{font-weight:700;font-size:14.5px;color:var(--txt)}
.gitem.open .gtitle{color:var(--neon-cyan);text-shadow:0 0 5px rgba(0,240,255,.5)}
.gbody{display:none;padding:6px 14px 14px}
.gitem.open .gbody{display:block}
.gen-split{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px}
.gen-fields{display:flex;flex-direction:column;gap:10px}
.field label{display:block;font-size:12.8px;color:var(--dim);margin-bottom:3px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:var(--panel);border:1px solid var(--dim);color:var(--txt);
  border-radius:7px;padding:9px 10px;font-size:14px;font-family:inherit}
.field textarea{font-family:Consolas,'Courier New',monospace;font-size:12.8px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{
  outline:none;border-color:var(--neon-cyan);box-shadow:0 0 6px rgba(0,240,255,.5)}
.field.check{display:flex;gap:8px;align-items:center}
.field.check label{margin:0;font-size:13.5px;color:var(--txt)}
.field-help{font-size:11.5px;color:var(--dim);margin-top:2px}
.field-error{font-size:11.5px;color:var(--neon-yellow);margin-top:2px}
.gen-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn-reset{background:transparent;border:1px solid var(--neon-violet);color:var(--neon-violet);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.btn-reset:hover{box-shadow:0 0 8px rgba(176,38,255,.6)}
.btn-copyall{background:transparent;border:1px solid var(--neon-green);color:var(--neon-green);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.btn-copyall:hover{box-shadow:0 0 8px var(--neon-green)}
.gen-result{min-width:0}
.empty{color:var(--dim);font-style:italic;padding:14px}

/* mapa de carpetas interactivo */
.tree{font-family:Consolas,'Courier New',monospace;font-size:12.8px;line-height:1.75;background:var(--code-bg);
  border:1px solid var(--dim);border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:pre}
.tline{display:block;cursor:default;border-radius:4px;padding:0 4px}
.tline.clickable{cursor:pointer}
.tline.clickable:hover{background:rgba(0,240,255,.08);outline:1px solid rgba(0,240,255,.35)}
.tline.sel{background:rgba(255,242,0,.1);outline:1px solid var(--neon-yellow)}
.t-back{color:var(--neon-magenta)} .t-front{color:var(--neon-cyan)} .t-plain{color:var(--dim)}
.tree-info{border:1px dashed var(--neon-yellow);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px;min-height:44px}

/* diagrama de flujo */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.fbox{border:1px solid var(--neon-cyan);color:var(--neon-cyan);border-radius:9px;padding:9px 13px;
  font-size:13px;font-weight:700;box-shadow:0 0 6px rgba(0,240,255,.4);background:#0a0418}
.fbox.back{border-color:var(--neon-magenta);color:var(--neon-magenta);box-shadow:0 0 6px rgba(255,43,214,.4)}
.farrow{color:var(--neon-green);font-weight:800;font-size:13px;text-shadow:0 0 5px rgba(57,255,20,.5)}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#0a1a0a;border:1px solid var(--neon-green);color:var(--neon-green);padding:10px 22px;
  border-radius:9px;font-weight:800;font-size:14px;box-shadow:0 0 12px rgba(57,255,20,.6);
  transition:opacity .18s, transform .18s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* responsive */
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none;position:static;max-height:none}
  select.mobilenav{display:block}
  .gen-split{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title flicker">⚡ SÚPER ARCHIVO DAI</h1>
  <p class="app-sub">5ta Informática · Instituto Pío IX · Sección 📘 TEORÍA — funciona 100% offline (doble clic). Atajo: <b>/</b> busca.</p>

  <div class="topbar">
    <div class="main-tabs" role="tablist">
      <a class="mtab active" href="teoria.html">📘 TEORÍA</a>
      <a class="mtab" href="generador.html">⚡ GENERADOR</a>
    </div>
    <span class="legend"><span class="badge back">🟣 BACK</span><span class="badge front">🔵 FRONT</span></span>
    <div class="searchbox">
      <input id="buscador" type="text" placeholder="🔍 Buscar temas y contenido… (tocá / para enfocar)" autocomplete="off">
    </div>
  </div>

  <select id="mobileNav" class="mobilenav" aria-label="Elegir tema"></select>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Temas"></nav>
    <main id="content"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   📘 DAI — Teoría (offline) — un solo HTML, sin CDN, sin servidor.
   Motor genérico abajo; los DATOS están en las constantes marcadas.
   ===================================================================== */


// ---------- helpers usados por los generadores (no tocar) ----------
function L(lines){ return lines.join("\n"); }                       // R6: array de líneas → string
function q(opt, s){
  const c=(opt&&opt.doubles===false)?"'":'"';
  let v=String(s==null?"":s).trim();
  if(v.startsWith("{") && v.endsWith("}")) return v;      // expresión JS: va sin comillas
  v=v.replace(/["']/g,"");                                 // sin comillas internas
  const num=/^-?\d+(\.\d+)?$/.test(v);
  return num ? "{"+v+"}" : c+v+c;                          // números van en { }
}
function cmt(opt, t){ return (opt&&opt.comentarios===false) ? null : "// "+t; }
function withC(arr){ return arr.filter(x=>x!==null); }              // saca los comentarios desactivados
function pascal(s){ return String(s||"").trim().split(/[^A-Za-z0-9]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(""); }
function camel(s){ const p=pascal(s); return p? p[0].toLowerCase()+p.slice(1):""; }
function setterName(s){ return "set"+pascal(s); }
function splitList(s){ return String(s||"").split(",").map(x=>x.trim()).filter(Boolean); }
function parseLines(s){ return String(s||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean); }
function normKey(s){ return String(s||"").trim().replace(/[^A-Za-z0-9_]/g,"").replace(/^(\d)/,"_$1"); }
function esc0(s){ return String(s==null?"":s); }
function cmpExpr(ref, op, val){
  const vv=String(val||"").trim();
  const esNum=/^-?\d+(\.\d+)?$/.test(vv) || vv==="true" || vv==="false";
  const lit = esNum? vv : q({dobles:true}, vv);
  if(op==="includes") return ref+".includes("+lit+")";
  if(op==="===") return ref+" === "+lit;
  if(op==="==") return ref+" == "+lit;
  return ref+" "+op+" "+vv;
}
function descMetodo(m){
  return ({push:"navega guardando historial",replace:"navega SIN guardar historial",back:"vuelve atrás",forward:"avanza",refresh:"recarga la página"})[m]||m;
}
function pushLista(arr, st, opt, pad){
  // renderiza la <ul> interna de una lista (respeta Modo TP1)
  if(opt.tp1){
    arr.push(pad+"{itemsJSX} {/* Modo TP1: armá itemsJSX con forEach + push (ver generador Métodos de array) */}");
  } else {
    arr.push(pad+"{"+st+".map(item => (");
    arr.push(pad+"  <li key={item.id}>{item.nombre}</li>");
    arr.push(pad+"))}");
  }
}
function pushMsgList(arr, opt, pad, expr){
  // lista de mensajes: .map normally; Modo TP1 → itemsJSX con forEach + push (sin map/filter/find)
  const e = expr || "{JSON.stringify(m)}";
  if(opt.tp1){
    arr.push("  let itemsJSX = [];");
    arr.push("  mensajes.forEach((m, i) => {");
    arr.push("    itemsJSX.push(<li key={i}>"+e+"</li>);");
    arr.push("  });", "");
    arr.push(pad+"{itemsJSX}");
  } else {
    arr.push(pad+"{mensajes.map((m, i) => (");
    arr.push(pad+"  <li key={i}>"+e+"</li>");
    arr.push(pad+"))}");
  }
}


// =====================================================================
// ---------- MAPA

// =====================================================================
// ---------- MAPA DE CARPETAS (datos del "🗺️ Mapa de carpetas") --------
// =====================================================================
const MAPA_CARPETAS = {
  intro:"Árbol exacto del proyecto real del TP2 (Pio Socket). Cada archivo es clickeable: hace clic para ver qué va adentro. 🟣 magenta = BACK · 🔵 cyan = FRONT.",
  tree:[
    { line:"PROYECTO/", side:"plain" },
    { line:"├── backend/                      ← 🟣 BACK  (Node + Express + Socket.IO, puerto 4000)", side:"back", path:"backend/", info:"Carpeta del servidor Node.js. Se inicia con npm init -y y vive aparte del front. Puerto 4000 para sockets (TP2/Integrador) o 3001 para fetch puro." },
    { line:"│   ├── .gitignore                  (excluir node_modules y *.env)", side:"back", path:"backend/.gitignore", info:"Debe excluir node_modules/ y los archivos *.env (secretos)." },
    { line:"│   ├── index.js                    servidor, CORS, sesiones, eventos de socket", side:"back", path:"backend/index.js", info:"El servidor entero: express(), cors(), express-session(), server en el puerto, io(server, {cors}) y io.on(\"connection\") con joinRoom / pingAll / sendMessage / disconnect. ⚠️ En el apunte de fetch se llama app.js; es lo mismo, elegí uno." },
    { line:"│   ├── package.json", side:"back", path:"backend/package.json", info:"Dependencias del back: express, cors, socket.io, express-session, mysql2 (TP Integrador)." },
    { line:"│   ├── package-lock.json", side:"back", path:"backend/package-lock.json", info:"Lock automático de npm. No lo tocás." },
    { line:"│   ├── README.md", side:"back", path:"backend/README.md", info:"Instrucciones para correr el back." },
    { line:"│   └── modulos/", side:"back" },
    { line:"│       └── mysql.js                (solo TP Integrador: conexión a MySQL)", side:"back", path:"backend/modulos/mysql.js", info:"Crea el pool de mysql2/promise (host, user, password, database) y lo exporta con module.exports = pool. Lo importan los endpoints." },
    { line:"├── frontend/                     ← 🔵 FRONT (Next.js App Router, puerto 3000 / 3001)", side:"front", path:"frontend/", info:"Proyecto Next.js creado con npx create-next-app@latest. Dev normal en 3000; con dev:a/dev:b se levantan dos instancias (3000 y 3001)." },
    { line:"│   ├── .gitignore                  (excluir node_modules, .next y .next*)", side:"front", path:"frontend/.gitignore", info:"Ojo: con múltiples instancias hay que reemplazar .next/ por .next* para ignorar también .next-a y .next-b." },
    { line:"│   ├── eslint.config.mjs", side:"front", path:"frontend/eslint.config.mjs", info:"Config de ESLint que trae create-next-app." },
    { line:"│   ├── jsconfig.json", side:"front", path:"frontend/jsconfig.json", info:"Define el alias @/* → src/* (por eso importás @/components/Button)." },
    { line:"│   ├── next.config.mjs", side:"front", path:"frontend/next.config.mjs", info:"Config de Next. Para múltiples instancias agregar: distDir: process.env.NEXT_DIST_DIR || \".next\"." },
    { line:"│   ├── package.json", side:"front", path:"frontend/package.json", info:"Acá van los scripts dev:a / dev:b (cross-env) y las deps socket.io-client, clsx, reactjs-popup." },
    { line:"│   ├── package-lock.json", side:"front" },
    { line:"│   ├── README.md", side:"front" },
    { line:"│   ├── public/                     imágenes y archivos estáticos", side:"front", path:"frontend/public/", info:"Imágenes/fuentes servidas desde la raíz: /logo.png se usa como <img src=\"/logo.png\">." },
    { line:"│   └── src/", side:"front" },
    { line:"│       ├── app/                    ← cada CARPETA = una RUTA", side:"front", path:"src/app/", info:"App Router: la carpeta define la URL. src/app/page.js = \"/\", src/app/chat/page.js = \"/chat\". Cada page.js export default un componente." },
    { line:"│       │   ├── favicon.ico", side:"front" },
    { line:"│       │   ├── globals.css", side:"front", path:"src/app/globals.css", info:"CSS global: se importa en layout.js y aplica a todo el sitio." },
    { line:"│       │   ├── layout.js           layout raíz (recibe children)", side:"front", path:"src/app/layout.js", info:"Envuelve TODAS las páginas. Recibe { children } y renderiza <html><body>{children}</body></html>. Es Server Component por defecto (no lleva hooks)." },
    { line:"│       │   ├── page.js             ruta \"/\"", side:"front", path:"src/app/page.js", info:"La home. Acá se arma el formulario con los links (usuario + sala → router.push(\"/chat?...\"))." },
    { line:"│       │   ├── page.module.css", side:"front", path:"src/app/page.module.css", info:"Estilos de la home (en TP1 el docente provee Home.module.css y va ACÁ con ese nombre)." },
    { line:"│       │   ├── socket/", side:"front" },
    { line:"│       │   │   └── page.js         ruta \"/socket\"", side:"front", path:"src/app/socket/page.js", info:"Página de prueba del WebSocket: muestra isConnected con ternario, botón pingAll con socket.emit y escucha con socket.on dentro de useEffect([socket]). Lleva \"use client\"." },
    { line:"│       │   └── chat/", side:"front" },
    { line:"│       │       └── page.js         ruta \"/chat\"", side:"front", path:"src/app/chat/page.js", info:"Chat: lee sala y usuario con useSearchParams, hace socket.emit(\"joinRoom\", { room }), input+botón sendMessage, escucha newMessage y chat-messages, cleanup con socket.off." },

/* =====================================================================
   ============================  MOTOR (no tocar)  =====================
   ===================================================================== */
var state = { sec:"teoria", tema:"mapa", openGen:null };
var opts  = { comentarios:true, dobles:true, tp1:false };
var valores = {};          // valores editados por generador: key = tema|gen|campo
// -- localStorage con try/catch (R10) --
function saveState(){
  try{
    localStorage.setItem("superdai", JSON.stringify({ state:state, opts:opts, valores:valores }));
  }catch(e){ /* si falla, funciona igual */ }
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem("superdai") || "null");
    if(s){
      if(s.state && s.state.sec) state.sec = s.state.sec;
      if(s.state && s.state.tema) state.tema = s.state.tema;
      if(s.opts) opts = Object.assign(opts, s.opts);
      if(s.valores) valores = s.valores;
    }
  }catch(e){}
}

// -- utilidades de escape/formato --
function escHTML(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inlineFmt(t){
  var s=escHTML(t);
  s=s.replace(/`([^`]+)`/g, function(_,c){return "<code>"+c+"</code>";});
  s=s.replace(/\*\*([^*]+)\*\*/g, function(_,c){return "<strong>"+c+"</strong>";});
  return s;
}
function hl(text){
  var s=escHTML(text);
  if(!busqText) return s;
  try{
    var rx=new RegExp("("+busqText.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    return s.replace(rx,"<mark>$1</mark>");
  }catch(e){ return s; }
}
var busqText = "";

// -- copiar con fallback (R3): copia SIEMPRE el string original --
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("show");},1500);
}
function doCopy(txt){
  var ok=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast("✅ ¡Copiado!");},
        function(){legacyCopy(txt);});
      return;
    }
  }catch(e){}
  legacyCopy(txt);
  function legacyCopy(t2){
    var ta=document.createElement("textarea");
    ta.value=t2; ta.style.position="fixed"; ta.style.left="-9999px";
    document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    toast(ok ? "✅ ¡Copiado!" : "⚠️ No se pudo copiar — seleccioná el código");
  }
}

// -- opciones globales --
function getOpts(){
  return { comentarios:opts.comentarios, doubles:opts.dobles, tp1:opts.tp1 };
}

// ---- render general ----
function temaNombres(){
  var arr=[];
  if(state.sec==="teoria"){ arr.push({id:"mapa", nombre:"🗺️ Mapa de carpetas"}); TEORIA.forEach(function(t){arr.push({id:t.id,nombre:t.nombre});}); }
  else { GENERADORES.forEach(function(g){arr.push({id:g.id,nombre:g.nombre});}); }
  return arr;
}
function renderSidebar(){
  var sb=document.getElementById("sidebar");
  var mv=document.getElementById("mobileNav");
  var names=temaNombres();
  var filtered=names.filter(function(n){
    if(!busqText) return true;
    var hay=[n.nombre];
    if(state.sec==="teoria"){
      var t=TEORIA.find(function(x){return x.id===n.id;});
      if(t) hay.push(searchableDeTema(t));
    } else {
      var g=GENERADORES.find(function(x){return x.id===n.id;});
      if(g) hay.push((g.desc||"")+g.generadores.map(function(x){return x.titulo;}).join(" "));
    }
    return hay.join(" ").toLowerCase().indexOf(busqText.toLowerCase())>=0;
  });
  var h='<div class="side-label">'+(state.sec==="teoria"?"Temas de teoría":"Temas de generador")+"</div>";
  filtered.forEach(function(n){
    h+='<button class="sbtn'+(n.id===state.tema?" active":"")+'" data-id="'+n.id+'" type="button">'+hl(n.nombre)+"</button>";
  });
  if(!filtered.length) h+='<p class="hint">Sin resultados para “'+escHTML(busqText)+"”.</p>";
  sb.innerHTML=h;
  Array.prototype.forEach.call(sb.querySelectorAll(".sbtn"),function(b){
    b.addEventListener("click",function(){ selectTema(b.getAttribute("data-id")); });
  });
  var mh="<option value=\"\">— Elegí un tema —</option>";
  filtered.forEach(function(n){ mh+='<option value="'+n.id+'"'+(n.id===state.tema?" selected":"")+">"+escHTML(n.nombre)+"</option>"; });
  mv.innerHTML=mh;
}
function searchableDeTema(t){
  var parts=[t.nombre,t.intro,(t.claves||[]).join(" "),(t.errores||[]).join(" "),
    (t.donde||[]).join(" ")];
  (t.codigos||[]).forEach(function(c){parts.push(c.titulo||"",c.archivo||"");});
  (t.extra||[]).forEach(function(b){ if(b.x) parts.push(b.x); });
  return parts.join(" ");
}
function selectTema(id){
  state.tema=id; state.openGen=null; saveState(); renderAll();
  document.getElementById("content").scrollIntoView({block:"start"});
}
function renderAll(){
  document.getElementById("tabTeoria").classList.toggle("active", state.sec==="teoria");
  document.getElementById("tabGen").classList.toggle("active", state.sec==="gen");
  var names=temaNombres();
  if(!names.some(function(n){return n.id===state.tema;})) state.tema=names[0].id;
  renderSidebar();
  var c=document.getElementById("content");
  c.innerHTML="";
  if(state.tema==="mapa") renderMapa(c);
  else if(state.sec==="teoria") renderTeoria(c, TEORIA.find(function(t){return t.id===state.tema;}), state.tema);
  else renderGen(c, GENERADORES.find(function(g){return g.id===state.tema;}), state.tema);
}

// ---- TEORÍA ----
function tableHTML(tb){
  var h='<table class="neon-table"><thead><tr>'+tb.head.map(function(x){return "<th>"+inlineFmt(x)+"</th>";}).join("")+"</tr></thead><tbody>";
  tb.rows.forEach(function(r){ h+="<tr>"+r.map(function(c){return "<td>"+inlineFmt(c)+"</td>";}).join("")+"</tr>"; });
  return h+"</tbody></table>";
}
function flowHTML(f){
  return '<div class="flow">'+f.parts.map(function(p,i){
    return '<span class="fbox'+(p.lado==="BACK"?" back":"")+'">'+inlineFmt(p.t)+"</span>"+
           (p.arrow?'<span class="farrow">'+escHTML(p.arrow)+"</span>":"");
  }).join("")+"</div>";
}
function renderBloques(arr){
  var h="";
  arr.forEach(function(b){
    if(b.t==="h3") h+="<h3>"+hl(b.x)+"</h3>";
    else if(b.t==="p") h+="<p>"+inlineFmt(hl(b.x))+"</p>";
    else if(b.t==="ul") h+="<ul>"+b.items.map(function(i){return "<li>"+inlineFmt(hl(i))+"</li>";}).join("")+"</ul>";
    else if(b.t==="warn") h+='<ul class="warn-list">'+b.items.map(function(i){return "<li>"+inlineFmt(hl(i))+"</li>";}).join("")+"</ul>";
    else if(b.t==="table") h+=tableHTML(b);
    else if(b.t==="flow") h+=flowHTML(b);
    else if(b.t==="code") h+=codeBlockStr("", b.x||"", /BACK/.test(b.x||"")?"BACK":"FRONT");
    else if(b.t==="note") h+='<p class="hint" style="font-size:13px;margin:6px 0">'+inlineFmt(hl(b.x))+"</p>";
  });
  return h;
}
function codeBlockStr(title, archivo, lado){
  var badge = lado==="BACK" ? '<span class="badge back">🟣 BACK</span>'
            : lado==="FRONT" ? '<span class="badge front">🔵 FRONT</span>' : "";
  return '<div class="codeblock'+(lado==="BACK"?" back-border":"")+'"><div class="code-head"><span class="code-title">'+escHTML(title||"Código")+"</span>"
    +badge+(archivo?' <span class="code-file">· '+escHTML(archivo)+"</span>":"")
    +'</div><pre class="code"></pre></div>';
}
function collectCodigos(t){
  var list=[];
  (t.codigos||[]).forEach(function(c){list.push(c);});
  (t.extra||[]).forEach(function(b){
    if(b.t==="code"){
      var x=b.x||"";
      list.push({ titulo:"Código", archivo:x.replace(/\s*—\s*(🟣 BACK|🔵 FRONT)/,""), lado:/BACK/.test(x)?"BACK":"FRONT", codigo:b.codigo });
    }
  });
  return list;
}
function montarCodigos(root, codigos){
  var blocks=root.querySelectorAll(".codeblock");
  codigos.forEach(function(c,i){
    if(!blocks[i]) return;
    blocks[i].querySelector("pre.code").textContent=c.codigo;   // textContent: nunca innerHTML (R6)
    var btn=document.createElement("button");
    btn.className="btn-copy"; btn.type="button"; btn.textContent="📋 Copiar";
    btn.addEventListener("click",function(){ doCopy(c.codigo); });
    blocks[i].querySelector(".code-head").appendChild(btn);
  });
}
function renderTeoria(container, t, temaId){
  if(!t){ container.innerHTML='<div class="card"><h2>⚠️ Falta cargar este apunte</h2><p class="hint">No encuentro el archivo .md de este tema en el repo. No invento contenido (R12).</p></div>'; return; }
  var h='<div class="card"><h2>'+hl(t.nombre)+"</h2>";
  h+='<h3 style="margin-top:4px">Qué es / para qué sirve</h3><p>'+inlineFmt(hl(t.intro))+"</p>";
  h+='<h3>Conceptos y reglas clave</h3><ul>'+t.claves.map(function(k){return "<li>"+inlineFmt(hl(k))+"</li>";}).join("")+"</ul>";
  if(t.extra && t.extra.length){ h+=renderBloques(t.extra); }
  h+="</div>";
  if(t.donde && t.donde.length){
    h+='<div class="card"><h3 style="margin-top:0">📍 Dónde va cada archivo</h3><table class="neon-table"><thead><tr><th>Lado</th><th>Carpeta exacta</th><th>Archivo</th><th>Qué contiene</th></tr></thead><tbody>';
    t.donde.forEach(function(r){
      var lado=/🟣|BACK/.test(r[0])?"back":"front";
      h+="<tr><td><span class=\"badge "+lado+"\">"+escHTML(r[0])+"</span></td><td><code>"+escHTML(r[1])+"</code></td><td><code>"+escHTML(r[2])+"</code></td><td>"+inlineFmt(r[3])+"</td></tr>";
    });
    h+="</tbody></table></div>";
  }
  if(t.codigos && t.codigos.length){
    h+='<div class="card"><h3 style="margin-top:0">Código base</h3>';
    t.codigos.forEach(function(c){ h+=codeBlockStr(c.titulo, c.archivo, c.lado); });
    h+="</div>";
  }
  if(t.errores && t.errores.length){
    h+='<div class="card"><h3 style="margin-top:0">⚠️ Errores típicos</h3><ul class="warn-list">'
      + t.errores.map(function(e){return "<li>"+inlineFmt(hl(e))+"</li>";}).join("") + "</ul></div>";
  }
  container.innerHTML=h;
  montarCodigos(container, collectCodigos(t));
}

// ---- MAPA DE CARPETAS ----
function renderMapa(container){
  var M=MAPA_CARPETAS;
  var h='<div class="card"><h2>🗺️ Mapa de carpetas</h2><p>'+inlineFmt(M.intro)+"</p>";
  h+='<div class="tree" id="arbol">';
  M.tree.forEach(function(l,i){
    var cls = l.side==="back"?"t-back": l.side==="front"?"t-front":"t-plain";
    var click = l.info ? ' clickable" data-i="'+i+'"' : '"';
    h+='<span class="tline '+cls+click+">"+escHTML(l.line)+"</span>\n";
  });
  h+='</div><div class="tree-info" id="treeInfo">💡 Hacé clic en cualquier línea resaltada del árbol para ver qué va ahí.</div>';
  h+='<h3>Reglas para ubicar un archivo</h3><table class="neon-table"><tbody>';
  M.reglas.forEach(function(r){ h+="<tr><td>"+inlineFmt(r[0])+"</td><td>"+inlineFmt(r[1])+"</td></tr>"; });
  h+="</tbody></table>";
  h+='<h3>¿Qué va en BACK y qué en FRONT?</h3><table class="neon-table"><thead><tr><th>Tema</th><th>🟣 BACK</th><th>🔵 FRONT</th></tr></thead><tbody>';
  M.backFront.forEach(function(r){ h+="<tr><td>"+inlineFmt(r[0])+"</td><td>"+inlineFmt(r[1])+"</td><td>"+inlineFmt(r[2])+"</td></tr>"; });
  h+="</tbody></table>";
  h+='<p class="hint" style="color:var(--neon-yellow)">'+inlineFmt(M.notaPuertos)+"</p>";
  h+='<h3>Flujo de arquitectura</h3>'+renderBloques(M.flujos);
  h+='<h3>Estilos provistos por los docentes (TP1) y su destino exacto</h3><table class="neon-table"><thead><tr><th>Archivo provisto</th><th>Copiarlo a</th></tr></thead><tbody>';
  M.estilosTP1.forEach(function(r){ h+="<tr><td>"+inlineFmt(r[0])+"</td><td>"+inlineFmt(r[1])+"</td></tr>"; });
  h+="</tbody></table></div>";
  container.innerHTML=h;
  var info=document.getElementById("treeInfo");
  Array.prototype.forEach.call(container.querySelectorAll(".tline.clickable"),function(el){

      el.classList.add("sel");
    });
  });
}

// ---- GENERADOR ----
function valKey(temaId,gid,cid){ return temaId+"|"+gid+"|"+cid; }
function fieldVal(f, temaId, gid){
  var k=valKey(temaId,gid,f.id);
  if(Object.prototype.hasOwnProperty.call(valores,k)) return valores[k];
  return f.default!==undefined?f.default:(f.tipo==="checkbox"?false:"");
}
function optLabel(o){ return typeof o==="object"? o.l : String(o); }
function optValue(o){ return typeof o==="object"? o.v : String(o); }
function renderGen(container, g, temaId){
  if(!g){ container.innerHTML='<div class="card"><h2>⚠️ Falta cargar este apunte</h2><p class="hint">No hay generadores para este tema todavía.</p></div>'; return; }
  var h='<div class="card"><h2>⚡ '+escHTML(g.nombre)+"</h2>";
  if(g.desc) h+='<p class="gen-desc">'+inlineFmt(g.desc)+"</p>";
  h+="</div>";
  container.innerHTML=h;
  if(state.openGen===null && g.generadores.length) state.openGen=g.generadores[0].id;
  g.generadores.forEach(function(gen){
    var item=document.createElement("div");
    item.className="gitem"+(state.openGen===gen.id?" open":"");
    var head=document.createElement("div");
    head.className="ghead";
    head.innerHTML='<span class="gtitle">'+escHTML(gen.titulo)+'</span><span class="hint">'+(state.openGen===gen.id?"▲":"▼")+"</span>";
    head.addEventListener("click",function(){
      state.openGen = (state.openGen===gen.id)? null : gen.id;
      saveState(); renderAll();
    });
    item.appendChild(head);
    if(state.openGen===gen.id){
      var body=document.createElement("div"); body.className="gbody";
      var split=document.createElement("div"); split.className="gen-split";
      var fields=document.createElement("div"); fields.className="gen-fields";
      var result=document.createElement("div"); result.className="gen-result";
      gen.campos.forEach(function(f){ fields.appendChild(makeField(f, gen, temaId)); });
      var actions=document.createElement("div"); actions.className="gen-actions";
      var rb=document.createElement("button"); rb.type="button"; rb.className="btn-reset"; rb.textContent="↺ Restaurar valores de ejemplo";
      rb.addEventListener("click",function(){
        gen.campos.forEach(function(f){ delete valores[valKey(temaId,gen.id,f.id)]; });
        saveState(); renderAll();
      });
      actions.appendChild(rb);
      fields.appendChild(actions);
      split.appendChild(fields); split.appendChild(result);
      body.appendChild(split); item.appendChild(body);
      var files=[];
      try{ files=gen.salida(readVals(gen,temaId), getOpts()); }
      catch(err){ result.innerHTML='<p class="field-error">⚠️ Error generando: '+escHTML(err.message)+"</p>"; }
      pintarSalida(result, files, temaId, gen);
    }
    container.appendChild(item);
  });
}
function readVals(gen, temaId){
  var v={};
  gen.campos.forEach(function(f){ v[f.id]=fieldVal(f,temaId,gen.id); });
  return v;
}
function makeField(f, gen, temaId){
  var wrap=document.createElement("div");
  var cur=fieldVal(f,temaId,gen.id);
  if(f.tipo==="checkbox"){
    wrap.className="field check";
    wrap.innerHTML='<input type="checkbox" id="fld_'+gen.id+"_"+f.id+'"'+(cur?" checked":"")+'><label for="fld_'+gen.id+"_"+f.id+'">'+escHTML(f.label)+"</label>";
    var cb=wrap.querySelector("input");
    cb.addEventListener("change",function(){ valores[valKey(temaId,gen.id,f.id)]=cb.checked; saveState(); renderAll(); });
    return wrap;
  }
  wrap.className="field";
  var lab=document.createElement("label"); lab.textContent=f.label; wrap.appendChild(lab);
  var input;
  if(f.tipo==="select"){
    input=document.createElement("select");
    f.opciones.forEach(function(o){
      var op=document.createElement("option"); op.value=optValue(o); op.textContent=optLabel(o);
      if(String(optValue(o))===String(cur)) op.selected=true;
      input.appendChild(op);
    });
    input.addEventListener("change",function(){ valores[valKey(temaId,gen.id,f.id)]=input.value; saveState(); renderAll(); });
  } else if(f.tipo==="textarea"){
    input=document.createElement("textarea"); input.rows=Math.max(2,String(cur).split("\n").length);
    input.value=cur; if(f.placeholder) input.placeholder=f.placeholder;
    input.addEventListener("input",function(){ valores[valKey(temaId,gen.id,f.id)]=input.value; saveState(); renderAll(); });
  } else {
    input=document.createElement("input");
    input.type=f.tipo==="number"?"number":"text";
    input.value=(cur===undefined||cur===null)?"":cur;
    if(f.placeholder) input.placeholder=f.placeholder;
    input.addEventListener("input",function(){ valores[valKey(temaId,gen.id,f.id)]=input.value; saveState(); renderAll(); });
  }
  wrap.appendChild(input);
  if(f.hint){ var hp=document.createElement("div"); hp.className="field-help"; hp.textContent=f.hint; wrap.appendChild(hp); }
  if(f.validate==="pascal"){
    var err=document.createElement("div"); err.className="field-error";
    var raw=String(cur||"");
    if(!raw.trim()){ err.textContent="⚠️ Vacío: se usará un nombre de ejemplo."; wrap.appendChild(err); }
    else if(raw!==pascal(raw)){ err.textContent="⚠️ Debe ser PascalCase → se corrige automáticamente a \""+pascal(raw)+"\" en el código."; wrap.appendChild(err); }
  }
  return wrap;
}
function pintarSalida(result, files, temaId, gen){
  if(!files || !files.length){ result.innerHTML='<p class="empty">Sin salida.</p>'; return; }
  result.innerHTML="";
  files.forEach(function(f){
    var bl=document.createElement("div");
    bl.className="codeblock"+(f.lado==="BACK"?" back-border":"");
    var head=document.createElement("div"); head.className="code-head";
    var badgeTxt = f.lado==="BACK" ? "🟣 BACK" : f.lado==="FRONT" ? "🔵 FRONT" : f.lado;
    var bs=document.createElement("span"); bs.className="badge "+(f.lado==="BACK"?"back":"front"); bs.textContent=badgeTxt;
    var ft=document.createElement("span"); ft.className="code-file"; ft.textContent="· "+f.archivo;
    var ttl=document.createElement("span"); ttl.className="code-title"; ttl.textContent="📄";
    head.appendChild(ttl); head.appendChild(bs); head.appendChild(ft);
    var pre=document.createElement("pre"); pre.className="code"; pre.textContent=f.codigo;  // R6: textContent
    if(files.length>1){
      var b1=document.createElement("button"); b1.type="button"; b1.className="btn-copy"; b1.textContent="📋 Copiar código";
      b1.addEventListener("click",function(){ doCopy(f.codigo); });
      head.appendChild(b1);
    } else {
      var b2=document.createElement("button"); b2.type="button"; b2.className="btn-copy"; b2.textContent="📋 Copiar código";
      b2.addEventListener("click",function(){ doCopy(f.codigo); });
      head.appendChild(b2);
    }
    bl.appendChild(head); bl.appendChild(pre);
    result.appendChild(bl);
  });
  if(files.length>1){
    var all=document.createElement("button"); all.type="button"; all.className="btn-copyall"; all.textContent="📋 Copiar todo";
    all.addEventListener("click",function(){
      doCopy(files.map(function(f){
        return "// ===== "+f.archivo+"  ("+(f.lado==="BACK"?"🟣 BACK":"🔵 FRONT")+") =====\n"+f.codigo;
      }).join("\n\n"));
    });
    result.appendChild(all);
  }
}
